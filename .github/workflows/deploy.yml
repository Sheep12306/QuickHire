name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickhire-v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install pytest && pytest --tb=short --suppress-no-test-exit-error || echo "No tests yet"

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickhire-v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/quickhire || { echo "Project directory not found. Clone the repo first."; exit 1; }
            git fetch origin main
            # Backup the live database before reset (it must never be overwritten)
            cp quickhire-v2/backend/data/quickhire.db /tmp/quickhire.db.bak 2>/dev/null || true
            git reset --hard origin/main
            # Restore the live database
            cp /tmp/quickhire.db.bak quickhire-v2/backend/data/quickhire.db 2>/dev/null || true
            chown -R quickhire:quickhire quickhire-v2/backend/ 2>/dev/null || true
            bash quickhire-v2/deploy.sh
